<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote Request Sent | Vanguard Wheel Co.</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="https://vanguardwheelco.com/images/Logo_60px.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,900&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #263040; --orange: #e8631a; --cream: #f0e8d0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Barlow', sans-serif; background-color: var(--navy); color: var(--cream); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .wrap { max-width: 520px; }
    p.label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--orange); margin-bottom: 1rem; }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 900; text-transform: uppercase; margin-bottom: 1.25rem; line-height: 1.05; }
    p.body { font-weight: 300; line-height: 1.7; color: rgba(240,232,208,0.75); margin-bottom: 2.5rem; }
    a.btn { display: inline-block; background-color: var(--orange); color: var(--cream); padding: 0.85rem 2rem; font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="label">Request Received</p>
    <h1>Thanks — We'll Be In Touch</h1>
    <p class="body">Your quote request has been sent. We'll follow up by email to confirm fitment details and next steps.</p>
    <a href="https://vanguardwheelco.com" class="btn">Back to Vanguard</a>
  </div>
</body>
</html>
